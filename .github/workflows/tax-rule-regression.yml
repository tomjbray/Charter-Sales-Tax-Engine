name: Tax rule regression tests

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "tax-engine.js"
      - "rule-tests.js"
      - "dynamic-inputs.js"
      - "journey-context.js"
      - "territory-resolution.js"
      - "mad-apportionment.js"
      - "vat_rules.json"
      - "rule_tests.json"
      - "dynamic_input_tests.json"
      - "input_requirements.json"
      - "selling_entities.json"
      - "journey_context_tests.json"
      - "priority_tests.json"
      - "territory_tests.json"
      - "tax_territories.json"
      - "mad_apportionment.json"
      - "apportionment_tests.json"
      - "apportioned_calculation_tests.json"
      - "scripts/run-regression-tests.mjs"
      - "scripts/run-dynamic-input-tests.mjs"
      - "scripts/run-journey-context-tests.mjs"
      - "scripts/run-priority-tests.mjs"
      - "scripts/run-territory-tests.mjs"
      - "scripts/run-apportionment-tests.mjs"
      - "scripts/run-apportioned-calculation-tests.mjs"
      - ".github/workflows/tax-rule-regression.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.js"
      - "tax-engine.js"
      - "rule-tests.js"
      - "dynamic-inputs.js"
      - "journey-context.js"
      - "territory-resolution.js"
      - "mad-apportionment.js"
      - "vat_rules.json"
      - "rule_tests.json"
      - "dynamic_input_tests.json"
      - "input_requirements.json"
      - "selling_entities.json"
      - "journey_context_tests.json"
      - "priority_tests.json"
      - "territory_tests.json"
      - "tax_territories.json"
      - "mad_apportionment.json"
      - "apportionment_tests.json"
      - "apportioned_calculation_tests.json"
      - "scripts/run-regression-tests.mjs"
      - "scripts/run-dynamic-input-tests.mjs"
      - "scripts/run-journey-context-tests.mjs"
      - "scripts/run-priority-tests.mjs"
      - "scripts/run-territory-tests.mjs"
      - "scripts/run-apportionment-tests.mjs"
      - "scripts/run-apportioned-calculation-tests.mjs"
      - ".github/workflows/tax-rule-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression-tests:
    name: Run tax rule regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Check JavaScript syntax
        run: |
          node --check tax-engine.js
          node --check rule-tests.js
          node --check app.js
          node --check dynamic-inputs.js
          node --check journey-context.js
          node --check territory-resolution.js
          node --check scripts/run-dynamic-input-tests.mjs
          node --check scripts/run-journey-context-tests.mjs
          node --check scripts/run-priority-tests.mjs
          node --check scripts/run-territory-tests.mjs
          node --check mad-apportionment.js
          node --check scripts/run-apportionment-tests.mjs
          node --check scripts/run-apportioned-calculation-tests.mjs

      - name: Run regression tests
        run: npm test
