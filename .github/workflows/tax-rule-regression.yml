name: Tax rule regression tests

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "index.html"
      - ".github/workflows/tax-rule-regression.yml"

  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "package.json"
      - "index.html"
      - ".github/workflows/tax-rule-regression.yml"

  workflow_dispatch:
  
permissions:
  contents: read

jobs:
  regression-tests:
    name: Run tax rule regression tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.x"

      - name: Check JavaScript syntax
        run: |
          node --check src/tax-engine.js
          node --check src/rule-tests.js
          node --check src/app.js
          node --check src/allocation.js
          node --check src/calculation-engine.js
          node --check src/dynamic-inputs.js
          node --check src/journey-context.js
          node --check src/territory-resolution.js
          node --check tests/runners/run-dynamic-input-tests.mjs
          node --check tests/runners/run-journey-context-tests.mjs
          node --check tests/runners/run-priority-tests.mjs
          node --check tests/runners/run-territory-tests.mjs
          node --check src/mad-apportionment.js
          node --check tests/runners/run-apportionment-tests.mjs
          node --check tests/runners/run-apportioned-calculation-tests.mjs
          node --check tests/runners/run-allocation-tests.mjs
          node --check tests/runners/run-calculation-contract-tests.mjs
          node --check tests/runners/run-effective-date-tests.mjs
          node --check tests/runners/run-effective-date-calculation-tests.mjs

      - name: Run regression tests
        run: npm test

      - name: Run allocation tests
        run: node tests/runners/run-allocation-tests.mjs

      - name: Run calculation contract tests
        run: node tests/runners/run-calculation-contract-tests.mjs  

      - name: Run effective-date tests
        run: node tests/runners/run-effective-date-tests.mjs  

      - name: Run effective-date calculation tests
        run: node tests/runners/run-effective-date-calculation-tests.mjs
